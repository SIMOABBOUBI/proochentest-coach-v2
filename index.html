<!doctype html>
<html lang="fr" data-time="dag">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEF2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12131A" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Sproochentest — Coach A2</title>

<style>
:root{
  --ink:#0F1620; --ink-2:#3A4757; --ink-3:#6B7A8D;
  --paper:#EEF2F7; --card:#FFFFFF; --card-2:#F6F8FB;
  --line:#DCE3EC; --line-2:#C6D0DC;
  --sig:#C8102E;
  --sig-ink:#FFFFFF;
  --moselle:#0B6E8C;
  --moss:#3D7A4E; --amber:#B8791F; --plum:#6D3B7A;
  --shadow:0 1px 2px rgba(15,22,32,.05), 0 8px 24px -12px rgba(15,22,32,.18);
  --shadow-lift:0 2px 6px rgba(15,22,32,.06), 0 24px 48px -20px rgba(15,22,32,.28);
  --r:14px; --r-lg:20px; --r-sm:9px;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,
    "Bitstream Charter",Charter,Utopia,"Nimbus Roman","Liberation Serif","Times New Roman",ui-serif,serif;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --rail:0px; --tab:66px;
}
:root[data-time="owend"]{
  --ink:#F2E9DC; --ink-2:#C3B49F; --ink-3:#8E8172;
  --paper:#12131A; --card:#1B1D26; --card-2:#22242F;
  --line:#2C2F3B; --line-2:#3A3E4C;
  --sig:#E8A33D; --sig-ink:#1B1206;
  --moselle:#6FB3C8; --moss:#7FB98D; --amber:#E8A33D; --plum:#B78BC4;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
  --shadow-lift:0 2px 8px rgba(0,0,0,.45), 0 28px 56px -22px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; font-family:var(--sans); color:var(--ink); background:var(--paper);
  font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased;
  transition:background .5s ease, color .5s ease;
  overflow-wrap:break-word;
}
body.locked{overflow:hidden}
button,input,textarea,select{font:inherit; color:inherit}
button{cursor:pointer; background:none; border:0; padding:0}
a{color:var(--moselle)}
h1,h2,h3{margin:0; line-height:1.2; letter-spacing:-.015em; font-weight:650}
p{margin:0}
:focus-visible{outline:2.5px solid var(--sig); outline-offset:2px; border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none !important}

.lb{font-family:var(--serif); font-weight:500; letter-spacing:-.005em}
.num{font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:-.03em}

.ic{width:1.25em; height:1.25em; flex:0 0 auto; stroke:currentColor; fill:none;
  stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; vertical-align:-.22em}
.ic.sm{width:1.05em; height:1.05em}
.ic.lg{width:1.6em; height:1.6em}

.beat{display:inline-flex; gap:3px; align-items:flex-end; height:14px}
.beat i{display:block; width:3px; border-radius:2px; background:var(--sig); opacity:.3}
.beat i:nth-child(1){height:6px}
.beat i:nth-child(2){height:10px}
.beat i:nth-child(3){height:14px}
.beat i.on{opacity:1}
.beat.lg{height:22px} .beat.lg i{width:4px}
.beat.lg i:nth-child(1){height:9px}
.beat.lg i:nth-child(2){height:15px}
.beat.lg i:nth-child(3){height:22px}

.app{min-height:100dvh; display:flex}
.rail{display:none}
.main{flex:1; min-width:0; display:flex; flex-direction:column}
main#views{
  flex:1; width:100%; max-width:760px; margin:0 auto;
  padding:12px 18px calc(var(--tab) + env(safe-area-inset-bottom) + 28px);
}
.view{display:none; animation:rise .32s cubic-bezier(.2,.7,.3,1)}
.view.on{display:block}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.topbar{
  position:sticky; top:0; z-index:40; display:flex; align-items:center; gap:10px;
  padding:calc(env(safe-area-inset-top) + 10px) 18px 10px;
  background:color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter:saturate(1.6) blur(14px); -webkit-backdrop-filter:saturate(1.6) blur(14px);
  border-bottom:1px solid transparent; transition:border-color .2s;
}
.topbar.stuck{border-bottom-color:var(--line)}
.brand{display:flex; align-items:center; gap:9px; margin-right:auto; min-width:0}
.brand b{font-size:.98rem; font-weight:680; letter-spacing:-.02em; display:block}
.brand small{display:block; font-size:.66rem; color:var(--ink-3); letter-spacing:.09em; text-transform:uppercase; font-weight:600}
.hud{
  display:inline-flex; align-items:center; gap:5px; padding:6px 11px;
  border:1px solid var(--line); border-radius:999px; background:var(--card);
  font-size:.8rem; font-weight:640; white-space:nowrap;
}
.hud b{font-family:var(--mono); font-variant-numeric:tabular-nums}
.hud.pop{animation:pop .45s}
@keyframes pop{50%{transform:scale(1.14); border-color:var(--sig)}}

.tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:50; display:grid;
  grid-template-columns:repeat(6,1fr);
  padding-bottom:env(safe-area-inset-bottom);
  background:color-mix(in srgb, var(--paper) 92%, transparent);
  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--line);
}
.tabbar button{
  display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:9px 1px 8px; font-size:.58rem; font-weight:640; color:var(--ink-3);
  letter-spacing:0; min-width:0;
}
.tabbar button span{max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.tabbar button .ic{width:21px; height:21px; opacity:.7}
.tabbar button.on{color:var(--sig)} .tabbar button.on .ic{opacity:1}

.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow)}
.card.pad{padding:16px}
.sec{display:flex; align-items:center; gap:10px; margin:26px 0 12px}
.sec h2{font-size:.78rem; text-transform:uppercase; letter-spacing:.12em; font-weight:700; color:var(--ink-2)}
.sec .more{margin-left:auto; font-size:.76rem; font-weight:640; color:var(--moselle)}
.lead{color:var(--ink-2); font-size:.94rem}
.hint{color:var(--ink-3); font-size:.8rem}

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:11px 17px; border-radius:var(--r-sm); font-weight:660; font-size:.92rem;
  border:1px solid var(--line-2); background:var(--card); color:var(--ink);
  transition:transform .12s, box-shadow .2s, background .2s; text-align:center;
}
.btn:active{transform:scale(.975)}
.btn.sig{background:var(--sig); color:var(--sig-ink); border-color:transparent; box-shadow:var(--shadow)}
.btn.dim{background:transparent; border-color:var(--line)}
.btn.big{width:100%; padding:15px 18px; font-size:1rem; border-radius:var(--r)}
.btn[disabled]{opacity:.45; pointer-events:none}
.row{display:flex; gap:9px; flex-wrap:wrap}

.chips{display:flex; gap:7px; overflow-x:auto; padding:3px 18px 11px; margin:0 -18px; scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto; padding:7px 13px; border-radius:999px; border:1px solid var(--line);
  background:var(--card); font-size:.83rem; font-weight:620; white-space:nowrap;
}
.chip.on{background:var(--ink); color:var(--paper); border-color:var(--ink)}

.seg{display:flex; gap:3px; padding:3px; background:var(--card-2); border:1px solid var(--line);
  border-radius:var(--r-sm); overflow-x:auto; scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto; padding:8px 11px; border-radius:6px; font-size:.82rem; font-weight:640;
  color:var(--ink-2); white-space:nowrap}
.seg button.on{background:var(--card); color:var(--ink); box-shadow:var(--shadow)}

.bar{height:7px; border-radius:99px; background:var(--line); overflow:hidden}
.bar i{display:block; height:100%; background:var(--sig); border-radius:99px; transition:width .55s cubic-bezier(.2,.7,.3,1)}
.bar.thin{height:4px}

.tag{
  display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:999px;
  font-size:.68rem; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
  background:var(--card-2); color:var(--ink-2); border:1px solid var(--line);
}
.tag.sig{background:var(--sig); color:var(--sig-ink); border-color:transparent}
.tag.q{background:color-mix(in srgb, var(--moselle) 14%, var(--card)); color:var(--moselle); border-color:transparent}

.note{
  border-left:3px solid var(--line-2); padding:11px 0 11px 14px; margin:12px 0;
  font-size:.89rem; color:var(--ink-2);
}
.note.sig{border-left-color:var(--sig)}

.hero{
  position:relative; overflow:hidden; margin-top:6px;
  border:1px solid var(--line); border-radius:var(--r-lg); background:var(--card);
  box-shadow:var(--shadow-lift); padding:22px 20px 20px;
}
.hero .eyebrow{
  display:flex; align-items:center; gap:9px; margin-bottom:14px;
  font-size:.68rem; text-transform:uppercase; letter-spacing:.14em; font-weight:700; color:var(--ink-3);
}
.hero .qq{
  font-family:var(--serif); font-size:clamp(1.4rem, 5.4vw, 2rem); line-height:1.24;
  font-weight:500; letter-spacing:-.02em; margin-bottom:8px;
}
.hero .qfr{font-size:.86rem; color:var(--ink-3); margin-bottom:18px}
.hero .acts{display:flex; gap:9px; flex-wrap:wrap}
.hero.owend{background:linear-gradient(168deg, var(--card) 0%, color-mix(in srgb, var(--amber) 9%, var(--card)) 100%)}

.stat3{display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin-top:14px}
.stat3 div{
  background:var(--card); border:1px solid var(--line); border-radius:var(--r);
  padding:12px 10px; text-align:center;
}
.stat3 b{display:block; font-family:var(--mono); font-size:1.3rem; font-weight:670; letter-spacing:-.04em}
.stat3 span{display:block; font-size:.68rem; color:var(--ink-3); text-transform:uppercase; letter-spacing:.07em; font-weight:640; margin-top:2px}

.qgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(148px,1fr)); gap:9px}
.qtile{
  display:flex; flex-direction:column; gap:5px; align-items:flex-start; text-align:left;
  padding:13px 14px; border:1px solid var(--line); border-radius:var(--r);
  background:var(--card); transition:transform .12s, box-shadow .2s;
}
.qtile:active{transform:scale(.98)}
.qtile .ic{width:22px; height:22px; color:var(--sig)}
.qtile b{font-size:.9rem; font-weight:660}
.qtile span{font-size:.75rem; color:var(--ink-3); line-height:1.35}

.plan{list-style:none; margin:0; padding:0}
.plan li{display:flex; gap:12px; align-items:flex-start; padding:12px 2px; border-bottom:1px solid var(--line)}
.plan li:last-child{border-bottom:0}
.plan .tick{
  flex:0 0 auto; width:22px; height:22px; border-radius:7px; border:1.5px solid var(--line-2);
  display:grid; place-items:center; font-size:.75rem; margin-top:1px; background:var(--card);
}
.plan li.done .tick{background:var(--moss); border-color:var(--moss); color:#fff}
.plan li.done .txt{color:var(--ink-3); text-decoration:line-through}
.plan .txt{flex:1; font-size:.92rem; line-height:1.4}
.plan .txt small{display:block; color:var(--ink-3); font-size:.76rem; text-decoration:none}

.axes{display:grid; gap:11px}
.axis{display:grid; grid-template-columns:1fr auto; gap:4px 10px; align-items:center}
.axis b{font-size:.85rem; font-weight:640}
.axis .v{font-family:var(--mono); font-size:.78rem; color:var(--ink-3)}
.axis .bar{grid-column:1/-1}

.rows{display:grid}
.qrow{
  display:grid; grid-template-columns:auto 1fr auto; gap:10px; align-items:center;
  padding:13px 14px; border-bottom:1px solid var(--line); text-align:left; width:100%;
}
.qrow:last-child{border-bottom:0}
.qrow .n{font-family:var(--mono); font-size:.72rem; color:var(--ink-3); min-width:2.4em}
.qrow .q{font-family:var(--serif); font-size:.95rem; line-height:1.35}
.qrow .q small{display:block; font-family:var(--sans); font-size:.74rem; color:var(--ink-3); margin-top:2px}
.qrow .st{font-size:.9rem; opacity:.85}
.qrow.mine{background:color-mix(in srgb, var(--moss) 7%, var(--card))}

.deck{display:grid; grid-template-columns:1fr auto; gap:3px 12px; align-items:center;
  padding:13px 14px; border-bottom:1px solid var(--line); text-align:left; width:100%}
.deck:last-child{border-bottom:0}
.deck b{font-size:.93rem; font-weight:640}
.deck .v{font-family:var(--mono); font-size:.76rem; color:var(--ink-3)}
.deck .bar{grid-column:1/-1; margin-top:5px}

.pgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:11px}
.pcell{border:1px solid var(--line); border-radius:var(--r); overflow:hidden; background:var(--card); text-align:left}
.pcell img{display:block; width:100%; aspect-ratio:4/3; object-fit:cover; background:var(--card-2)}
.pcell .cap{padding:9px 11px 11px}
.pcell .cap b{display:block; font-family:var(--serif); font-size:.9rem; font-weight:540}
.pcell .cap span{display:block; font-size:.72rem; color:var(--ink-3); margin-top:1px}
.pfull img{width:100%; border-radius:var(--r); display:block; box-shadow:var(--shadow)}
.pblock{border-top:1px solid var(--line); padding:13px 0}
.pblock:first-of-type{border-top:0}
.pblock .lab{display:flex; align-items:baseline; gap:8px; margin-bottom:5px}
.pblock .lab b{font-size:.74rem; text-transform:uppercase; letter-spacing:.09em; font-weight:700; color:var(--sig)}
.pblock .lab span{font-size:.74rem; color:var(--ink-3)}
.pblock p{font-family:var(--serif); font-size:.96rem; line-height:1.5}

.fold{border:1px solid var(--line); border-radius:var(--r); background:var(--card); margin-bottom:9px; overflow:hidden}
.fold>summary{padding:14px 16px; font-weight:640; cursor:pointer; list-style:none; display:flex; gap:10px; align-items:center}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::after{content:'+'; margin-left:auto; font-family:var(--mono); color:var(--ink-3); font-size:1.1rem}
.fold[open]>summary::after{content:'−'}
.fold .body{padding:0 16px 16px}
.fold em{font-style:normal; font-size:1.15rem}

.gline{display:grid; grid-template-columns:auto 1fr; gap:9px; padding:8px 0; border-top:1px solid var(--line); align-items:baseline}
.gline:first-child{border-top:0}
.gline .m{font-size:.85rem; line-height:1}
.gline .t{font-family:var(--serif); font-size:.94rem}
.gline .t small{display:block; font-family:var(--sans); font-size:.76rem; color:var(--ink-3); text-decoration:none}
.gline.bad .t{color:var(--ink-3)}
.gline.bad .t s{text-decoration-color:var(--sig); text-decoration-thickness:1.5px}

.frames{list-style:none; margin:8px 0 0; padding:0; display:grid; gap:7px}
.frames li{font-family:var(--serif); font-size:.93rem; padding:9px 12px; background:var(--card-2); border-radius:var(--r-sm); border:1px solid var(--line)}

table.conj{width:100%; border-collapse:collapse; font-size:.86rem}
table.conj td{padding:6px 8px; border-top:1px solid var(--line)}
table.conj td:first-child{color:var(--ink-3); width:38%}
table.conj td:last-child{font-family:var(--serif)}

.sx{
  position:fixed; inset:0; z-index:100; background:var(--paper);
  display:flex; flex-direction:column; animation:sxin .28s cubic-bezier(.2,.7,.3,1);
}
.sx.out{animation:sxout .2s forwards}
@keyframes sxin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes sxout{to{opacity:0;transform:translateY(10px)}}
.sx-top{
  display:flex; align-items:center; gap:12px;
  padding:calc(env(safe-area-inset-top) + 12px) 18px 10px;
}
.sx-x{width:34px; height:34px; border-radius:999px; border:1px solid var(--line); display:grid; place-items:center; font-size:1rem; background:var(--card)}
.sx-top .bar{flex:1}
.sx-top .cnt{font-family:var(--mono); font-size:.75rem; color:var(--ink-3)}
.sx-body{
  flex:1; overflow-y:auto; padding:8px 18px 20px;
  width:100%; max-width:640px; margin:0 auto; -webkit-overflow-scrolling:touch;
  display:flex; flex-direction:column;
}
.sx-body::before, .sx-body::after{content:''; flex:1 1 0; min-height:0}
.sx-body>*{flex:0 0 auto}
.fold .body .sec{margin-top:14px}
.sx-foot{
  padding:12px 18px calc(env(safe-area-inset-bottom) + 16px);
  width:100%; max-width:640px; margin:0 auto; display:grid; gap:8px;
  border-top:1px solid var(--line); background:var(--paper);
}
.kick{display:flex; align-items:center; gap:9px; margin-bottom:16px; font-size:.7rem;
  text-transform:uppercase; letter-spacing:.13em; font-weight:700; color:var(--ink-3)}
.prompt{font-family:var(--serif); font-size:clamp(1.25rem,4.8vw,1.65rem); line-height:1.3; font-weight:500; letter-spacing:-.015em}
.prompt-fr{font-size:.85rem; color:var(--ink-3); margin-top:7px}

.opts{display:grid; gap:8px; margin-top:20px}
.opt{
  display:flex; gap:11px; align-items:center; text-align:left; padding:13px 15px;
  border:1.5px solid var(--line); border-radius:var(--r); background:var(--card); font-size:.94rem;
  transition:transform .1s, border-color .18s, background .18s;
}
.opt:active{transform:scale(.99)}
.opt .k{font-family:var(--mono); font-size:.7rem; color:var(--ink-3); border:1px solid var(--line); border-radius:5px; padding:1px 5px}
.opt.ok{border-color:var(--moss); background:color-mix(in srgb, var(--moss) 11%, var(--card))}
.opt.no{border-color:var(--sig); background:color-mix(in srgb, var(--sig) 9%, var(--card))}
.opt[disabled]{opacity:1; pointer-events:none}

.reveal{margin-top:20px; padding:16px; border-radius:var(--r); background:var(--card); border:1px solid var(--line)}
.reveal .lab{font-size:.68rem; text-transform:uppercase; letter-spacing:.12em; font-weight:700; color:var(--ink-3); margin-bottom:7px}
.reveal p{font-family:var(--serif); font-size:1rem; line-height:1.5}
.reveal.hide{display:none}

.grades{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.grade{position:relative; padding:13px 6px; border-radius:var(--r-sm); border:1.5px solid var(--line);
  background:var(--card); font-size:.82rem; font-weight:660; display:grid; gap:3px; justify-items:center}
.grade em{font-style:normal; font-size:1.15rem}
.grade i{position:absolute; top:5px; right:7px; font-style:normal; font-family:var(--mono);
  font-size:.62rem; color:var(--ink-3); opacity:.75}
@media (pointer:coarse){.grade i{display:none}}
.grade.g0{border-color:color-mix(in srgb,var(--sig) 45%,var(--line))}
.grade.g2{border-color:color-mix(in srgb,var(--moss) 45%,var(--line))}

.speak{display:grid; place-items:center; gap:14px; padding:26px 0 8px}
.mic{
  width:104px; height:104px; border-radius:999px; display:grid; place-items:center;
  font-size:2.1rem; background:var(--card); border:1.5px solid var(--line-2); box-shadow:var(--shadow);
  transition:transform .15s;
}
.mic.rec{background:var(--sig); color:var(--sig-ink); border-color:transparent; animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--sig) 45%,transparent)}50%{box-shadow:0 0 0 16px transparent}}
.timer{font-family:var(--mono); font-size:2.4rem; font-weight:600; letter-spacing:-.05em}
.timer.warn{color:var(--sig)}

.stepno{
  min-width:56px; width:auto; padding:0 14px; height:56px; margin:0 auto; border-radius:999px;
  display:grid; place-items:center; font-family:var(--mono); font-size:1.5rem;
  font-weight:600; color:var(--sig); background:color-mix(in srgb, var(--sig) 12%, transparent);
  font-style:normal; letter-spacing:-.04em;
}
.stepno.sm{width:26px; height:26px; font-size:.85rem; margin:0}
.plan .tick .ic{width:13px;height:13px;color:var(--ink-3)}
.plan .tick.num{font-family:var(--mono); font-size:.72rem; color:var(--ink-3)}

.beats{display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin-top:16px}
.beats button{
  padding:11px 8px; border-radius:var(--r-sm); border:1.5px dashed var(--line-2);
  background:transparent; font-size:.78rem; font-weight:640; color:var(--ink-3); display:grid; gap:3px;
}
.beats button.on{border-style:solid; border-color:var(--sig); color:var(--ink); background:color-mix(in srgb,var(--sig) 8%,var(--card))}
.beats button small{font-size:.66rem; color:var(--ink-3); font-weight:500}

textarea.mine{
  width:100%; min-height:130px; padding:13px 14px; border-radius:var(--r); resize:vertical;
  border:1.5px solid var(--line); background:var(--card); font-family:var(--serif); font-size:1rem; line-height:1.5;
}
textarea.mine:focus{border-color:var(--moselle); outline:none}

.player{
  margin:16px 0 4px; padding:14px; border-radius:var(--r);
  border:1px solid var(--line); background:var(--card-2);
}
.player .btn{width:100%}
.plines{height:4px; border-radius:99px; background:var(--line); overflow:hidden; margin-top:11px}
.plines i{display:block; height:100%; background:var(--sig); width:0; transition:width .35s linear}
.chip.on{background:var(--ink); color:var(--paper); border-color:var(--ink)}

.lq{padding:14px 0; border-top:1px solid var(--line)}
.lq:first-child{border-top:0}
.lq-q{font-size:.96rem; font-weight:600; line-height:1.4}
.lq-q .num{color:var(--sig); margin-right:5px}
.lq .opts{margin-top:10px; gap:6px}
.lq .opt{padding:10px 13px; font-size:.9rem}
.lq .opt.on{border-color:var(--moselle); background:color-mix(in srgb,var(--moselle) 10%,var(--card))}
.lq-why{margin-top:9px; font-size:.84rem; color:var(--ink-2); border-left:3px solid var(--line-2); padding-left:11px}

.score{font-family:var(--mono); font-size:2.6rem; font-weight:650; letter-spacing:-.05em; line-height:1}
.score span{font-size:1.1rem; color:var(--ink-3)}
.script p{font-family:var(--serif); font-size:.94rem; line-height:1.55; margin-bottom:9px}
.script p:last-child{margin-bottom:0}
.script b{font-family:var(--sans); font-size:.78rem; color:var(--sig); font-weight:700}

.dcell{display:grid; grid-template-columns:auto 1fr auto; gap:11px; align-items:center;
  padding:13px 14px; border-bottom:1px solid var(--line); text-align:left; width:100%}
.dcell:last-child{border-bottom:0}
.dcell .ic{color:var(--sig)}
.dcell b{font-family:var(--serif); font-size:.96rem; font-weight:540; display:block}
.dcell small{font-size:.76rem; color:var(--ink-3)}
.dcell .best{font-family:var(--mono); font-size:.78rem; color:var(--ink-3)}
.dcell .best.good{color:var(--moss)}

.scrim{position:fixed; inset:0; z-index:200; background:rgba(6,10,16,.5); backdrop-filter:blur(3px);
  display:flex; align-items:flex-end; justify-content:center; animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{
  width:100%; max-width:560px; max-height:88dvh; overflow-y:auto;
  background:var(--paper); border-radius:var(--r-lg) var(--r-lg) 0 0;
  padding:10px 20px calc(env(safe-area-inset-bottom) + 22px);
  animation:up .3s cubic-bezier(.2,.7,.3,1);
}
@keyframes up{from{transform:translateY(26px)}to{transform:none}}
.grab{width:38px; height:4px; border-radius:99px; background:var(--line-2); margin:0 auto 14px}

.toasts{position:fixed; left:0; right:0; bottom:calc(var(--tab) + 14px); z-index:300;
  display:grid; gap:7px; justify-items:center; pointer-events:none; padding:0 16px}
.toast{
  background:var(--ink); color:var(--paper); padding:10px 15px; border-radius:999px;
  font-size:.85rem; font-weight:620; box-shadow:var(--shadow-lift); animation:tin .3s;
  display:flex; align-items:center; gap:8px; max-width:100%;
}
.toast.sig{background:var(--sig); color:var(--sig-ink)}
@keyframes tin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

@media (min-width:900px){
  :root{--rail:236px; --tab:0px}
  .tabbar{display:none}
  .rail{
    display:flex; flex-direction:column; gap:3px; width:var(--rail); flex:0 0 var(--rail);
    padding:22px 14px; border-right:1px solid var(--line); position:sticky; top:0; height:100dvh;
  }
  .rail .r-brand{display:flex; gap:10px; align-items:center; padding:0 8px 20px}
  .rail button.nav{
    display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:var(--r-sm);
    font-size:.9rem; font-weight:620; color:var(--ink-2); text-align:left;
  }
  .rail button.nav .ic{width:19px; height:19px}
  .rail button.nav.on{background:var(--card); color:var(--ink); box-shadow:var(--shadow)}
  .rail .spacer{flex:1}
  main#views{padding:16px 32px 60px; max-width:820px}
  .topbar{padding-top:18px; justify-content:flex-end}
  .topbar .brand b, .topbar>.beat{display:none}
  .topbar .brand{margin-right:auto}
  .topbar .brand small{font-size:.7rem}
  .toasts{bottom:22px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important}
}
</style>
</head>
